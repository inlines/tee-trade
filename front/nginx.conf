map $http_upgrade $connection_upgrade {
    default upgrade;
    '' '';
}
upstream futba_api {
    zone futba_api 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server backend:8080 resolve;
    keepalive 16;
}
server {
    listen 80;
    server_tokens off;
    include /etc/nginx/security-headers.conf;
    sendfile on;
    client_max_body_size 36m;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml;
    root /usr/share/nginx/html;
    index index.html;
    location = /metrics { return 404; }
    location ^~ /metrics/ { return 404; }
    location ~* ^/(?:main|chunk|styles)-[A-Za-z0-9]+\.(?:js|css)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location /images/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }
    location = /index.html { include /etc/nginx/security-headers.conf; add_header Cache-Control "no-cache"; }
    location / { try_files $uri $uri/ /index.html; }
    # Preserve existing URLs and product associations. Missing legacy files are
    # exported lazily by the backend until the explicit full migration finishes.
    location ~ "^/api/media/([a-fA-F0-9]{64})/preview$" {
        alias /data/media/$1.preview.jpg;
        types { }
        default_type image/jpeg;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Media-Storage filesystem;
        error_page 404 = @media_fallback;
    }
    location ~ "^/api/media/([a-fA-F0-9]{64})$" {
        alias /data/media/$1.jpg;
        types { }
        default_type image/jpeg;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Media-Storage filesystem;
        error_page 404 = @media_fallback;
    }
    location @media_fallback {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass http://futba_api;
        proxy_set_header Host $host;
    }
    location /api/ {
        proxy_pass http://futba_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 75s;
    }
}
