server {
    listen 80;
    sendfile on;
    client_max_body_size 9m;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml;
    root /usr/share/nginx/html;
    index index.html;
    location = /metrics { return 404; }
    location ^~ /metrics/ { return 404; }
    location ~* ^/(?:main|chunk|styles)-[A-Za-z0-9]+\.(?:js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location /images/ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location / { try_files $uri $uri/ /index.html; }
    # Preserve existing URLs and product associations. Missing legacy files are
    # exported lazily by the backend until the explicit full migration finishes.
    location ~ "^/api/media/([a-fA-F0-9]{64})/preview$" {
        alias /data/media/$1.preview.jpg;
        types { }
        default_type image/jpeg;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
        add_header X-Media-Storage filesystem;
        error_page 404 = @media_fallback;
    }
    location ~ "^/api/media/([a-fA-F0-9]{64})$" {
        alias /data/media/$1.jpg;
        types { }
        default_type image/jpeg;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
        add_header X-Media-Storage filesystem;
        error_page 404 = @media_fallback;
    }
    location @media_fallback {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 75s;
    }
}
